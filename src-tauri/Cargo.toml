[package]
name = "orbit"
version = "0.2.29"
description = "A local desktop workspace for Orbit"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
log = "=0.4.34"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-log = "=2.9.1"
tauri-plugin-dialog = "=2.7.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }

# The desktop Host uses a small blocking WebSocket server so mobile clients
# can connect over a trusted LAN. These are desktop-only; mobile builds use
# the shared TypeScript client and do not bundle a server.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
tungstenite = { version = "=0.26.2", default-features = false, features = ["handshake"] }
uuid = { version = "=1.26.0", features = ["v4"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4.6"
