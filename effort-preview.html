<!doctype html>
<html class="dark" lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Effort visual audit</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 32px; background: #171717; font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
      #root { display: grid; grid-template-columns: repeat(2, minmax(280px, 420px)); gap: 20px; }
      .preview { padding: 14px 16px 16px; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; background: #2a2826; }
      .preview > small { display: block; margin-bottom: 8px; color: #aaa; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/effort-preview.tsx"></script>
  </body>
</html>
