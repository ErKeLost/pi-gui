<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit</title>
    <script>
      try {
        const saved = localStorage.getItem('pi-gui.theme');
        const dark = saved === 'dark' || ((saved === 'system' || !saved) && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch {}
    </script>
    <style>
      /* Rendered in a transparent, undecorated Tauri window: only the mascot floats on the desktop. */
      html,body{margin:0;height:100%;background:transparent;overflow:hidden;-webkit-user-select:none;user-select:none;cursor:default}
      *{box-sizing:border-box}
      :root{--ring:rgba(140,120,230,.45)}
      html.dark{--ring:rgba(185,165,255,.5)}
      .splash{position:fixed;inset:0;display:grid;place-items:center;transition:opacity .45s cubic-bezier(.4,0,.2,1),transform .45s cubic-bezier(.4,0,.2,1),filter .45s}
      .stage{position:relative;display:grid;justify-items:center}
      .core{position:relative;width:300px;height:300px;display:grid;place-items:center}

      .halo{position:absolute;inset:34px;border-radius:50%;background:radial-gradient(circle,rgba(205,185,255,.7) 0%,rgba(160,205,255,.42) 36%,rgba(255,190,220,.2) 56%,transparent 70%);filter:blur(14px);opacity:0;animation:halo 1.1s ease-out .15s forwards,breathe 3.2s ease-in-out 1.3s infinite}

      .orbit{position:absolute;left:50%;top:50%;border-radius:50%;border:1.5px solid var(--ring);opacity:0;transform:translate(-50%,-50%) rotateX(68deg) rotateZ(-18deg) scale(.4)}
      .o1{width:262px;height:262px;animation:orbit-in .9s cubic-bezier(.2,.9,.3,1.2) .5s forwards}
      .o2{width:206px;height:206px;border-style:dashed;animation:orbit-in .9s cubic-bezier(.2,.9,.3,1.2) .65s forwards}
      .rot{position:absolute;inset:-1px;border-radius:50%;animation:spin 4.2s linear infinite}
      .o2 .rot{animation-duration:6.5s;animation-direction:reverse}
      .planet{position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#ffd6ea 35%,#b79cff 100%);box-shadow:0 0 14px 3px rgba(190,160,255,.85)}
      .o2 .planet{width:9px;height:9px;margin-left:-4.5px;top:-5px;background:radial-gradient(circle at 35% 30%,#fff 0%,#cfe6ff 40%,#8fb6ff 100%);box-shadow:0 0 10px 2px rgba(140,190,255,.85)}

      .burst{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(200,180,255,.75);opacity:0;animation:burst .9s ease-out .65s forwards}
      .burst.b2{border-color:rgba(255,200,230,.65);animation-delay:.8s}

      .shadow{position:absolute;left:50%;bottom:58px;width:104px;height:14px;margin-left:-52px;border-radius:50%;background:radial-gradient(closest-side,rgba(90,70,180,.35),transparent);opacity:0;animation:shadow-in .9s ease-out .3s forwards,shadow 3s ease-in-out 1.25s infinite}

      .logo{position:relative;z-index:2;width:156px;height:156px;opacity:0;transform-origin:50% 90%;animation:drop 1s cubic-bezier(.3,1.35,.5,1) .1s forwards,float 3s ease-in-out 1.25s infinite}
      .logo img{width:100%;height:100%;display:block;-webkit-user-drag:none;filter:drop-shadow(0 10px 22px rgba(140,120,230,.4))}
      .logo::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.8) 50%,transparent 65%);background-size:250% 100%;background-position:120% 0;-webkit-mask:url(/orbit-mark.png) center/contain no-repeat;mask:url(/orbit-mark.png) center/contain no-repeat;animation:shine 1.1s ease-in-out 1s forwards}

      .spark{position:absolute;z-index:3;width:16px;height:16px;opacity:0;background:linear-gradient(135deg,#fff3c4,#ffc2de);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 4px rgba(255,220,240,.9));animation:twinkle 1.8s ease-in-out infinite}
      .s1{top:50px;left:56px;animation-delay:.9s}
      .s2{top:80px;right:42px;width:11px;height:11px;background:linear-gradient(135deg,#dff0ff,#c9b8ff);animation-delay:1.2s}
      .s3{bottom:80px;left:38px;width:10px;height:10px;background:linear-gradient(135deg,#e6dcff,#ffc2de);animation-delay:1.5s}
      .s4{bottom:62px;right:64px;width:13px;height:13px;animation-delay:1.05s}
      .s5{top:26px;right:100px;width:8px;height:8px;background:linear-gradient(135deg,#dff0ff,#fff3c4);animation-delay:1.35s}
      .dot{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(200,190,255,.9);opacity:0;animation:twinkle 2.6s ease-in-out infinite}


      .splash.leaving{opacity:0;transform:scale(1.12);filter:blur(6px)}

      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes halo{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
      @keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.8}}
      @keyframes orbit-in{to{opacity:1;transform:translate(-50%,-50%) rotateX(68deg) rotateZ(-18deg) scale(1)}}
      @keyframes drop{0%{opacity:0;transform:translateY(-70px) scale(.6)}45%{opacity:1;transform:translateY(8px) scale(1.08,.9)}65%{transform:translateY(-6px) scale(.96,1.05)}82%{transform:translateY(2px) scale(1.02,.98)}100%{opacity:1;transform:none}}
      @keyframes float{0%,100%{translate:0 0;rotate:0deg}25%{rotate:2deg}50%{translate:0 -9px;rotate:0deg}75%{rotate:-2deg}}
      @keyframes shadow-in{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
      @keyframes shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.8);opacity:.6}}
      @keyframes shine{from{background-position:120% 0}to{background-position:-40% 0}}
      @keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}
      @keyframes burst{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(2.4)}}
      @media (prefers-reduced-motion:reduce){*,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
    </style>
  </head>
  <body>
    <div class="splash" id="splash">
      <div class="stage">
        <div class="core">
          <div class="halo"></div>
          <div class="orbit o2"><div class="rot"><span class="planet"></span></div></div>
          <div class="orbit o1"><div class="rot"><span class="planet"></span></div></div>
          <div class="burst"></div><div class="burst b2"></div>
          <div class="shadow"></div>
          <div class="logo"><img src="/orbit-mark.png" alt="Orbit" /></div>
          <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span><span class="spark s5"></span>
          <i class="dot" style="left:18px;top:140px;animation-delay:.4s"></i><i class="dot" style="right:14px;top:170px;animation-delay:1.1s"></i><i class="dot" style="left:120px;top:8px;animation-delay:1.7s"></i><i class="dot" style="right:40px;bottom:20px;animation-delay:.8s"></i>
        </div>
      </div>
    </div>
    <script>
      // Called by Rust right before it closes this window and reveals the main one.
      window.__orbitSplashLeave = () => document.getElementById('splash').classList.add('leaving');
    </script>
  </body>
</html>
