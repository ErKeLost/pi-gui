name: Release Orbit

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-14
            args: --target x86_64-apple-darwin
          - name: Linux x86_64
            os: ubuntu-22.04
            args: ""
          - name: Windows
            os: windows-latest
            args: ""

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Windows'

      - name: Install Intel macOS target
        if: matrix.name == 'macOS Intel'
        run: rustup target add x86_64-apple-darwin

      - name: Install Linux build dependencies
        if: matrix.name == 'Linux x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          tagName: v__VERSION__
          releaseName: Orbit v__VERSION__
          releaseBody: Signed installers for macOS, Linux, Windows, and Android. Linux auto-updates use the signed AppImage artifact.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  updater-json:
    name: Public updater URLs
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Rewrite latest.json to browser download URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release download "$tag" --pattern latest.json --repo "${GITHUB_REPOSITORY}"
          python3 - <<'PY'
          import json, pathlib, subprocess, os
          tag = os.environ['GITHUB_REF_NAME']
          repo = os.environ['GITHUB_REPOSITORY']
          data = json.loads(subprocess.check_output(['gh','release','view',tag,'--json','assets'], text=True))
          id_to_url = {asset['apiUrl'].rstrip('/').split('/')[-1]: asset['url'] for asset in data['assets']}
          latest = json.loads(pathlib.Path('latest.json').read_text())
          for meta in latest.get('platforms', {}).values():
            url = meta.get('url', '')
            if '/releases/assets/' in url:
              meta['url'] = id_to_url[url.rstrip('/').split('/')[-1]]
          pathlib.Path('latest.json').write_text(json.dumps(latest, indent=2) + '\n')
          PY
          gh release upload "$tag" latest.json --clobber --repo "${GITHUB_REPOSITORY}"

  android:
    name: Android ARM64
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$android_home"
          export ANDROID_SDK_ROOT="$android_home"
          export PATH="$android_home/cmdline-tools/latest/bin:$android_home/cmdline-tools/16.0/bin:$android_home/platform-tools:$PATH"
          echo "ANDROID_HOME=$android_home" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_home" >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13846066"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Restore Android signing key
        env:
          ORBIT_ANDROID_KEYSTORE_BASE64: ${{ secrets.ORBIT_ANDROID_KEYSTORE_BASE64 }}
          ORBIT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_ANDROID_KEYSTORE_PASSWORD }}
          ORBIT_ANDROID_KEY_ALIAS: ${{ secrets.ORBIT_ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ORBIT_ANDROID_KEYSTORE_BASE64" || { echo "Missing ORBIT_ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "$ORBIT_ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ORBIT_ANDROID_KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "$ORBIT_ANDROID_KEY_ALIAS" || { echo "Missing ORBIT_ANDROID_KEY_ALIAS" >&2; exit 1; }
          key_path="$RUNNER_TEMP/orbit-android-release.jks"
          printf '%s' "$ORBIT_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          password=$ORBIT_ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ORBIT_ANDROID_KEY_ALIAS
          storeFile=$key_path
          EOF

      - name: Build signed Android APK
        run: bun run tauri android build --target aarch64 --apk

      - name: Stage Android APK
        run: cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "orbit-android-arm64-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-android-arm64-${{ github.ref_name }}
          path: orbit-android-arm64-${{ github.ref_name }}.apk
          if-no-files-found: error

      - name: Upload Android APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          asset="orbit-android-arm64-${tag}.apk"
          for attempt in $(seq 1 60); do
            if gh release view "$tag" >/dev/null 2>&1; then break; fi
            sleep 10
          done
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Orbit $tag" --generate-notes
          gh release upload "$tag" "$asset" --clobber
